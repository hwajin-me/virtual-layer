name: "Lint"

on:
  workflow_dispatch:
  push:
    branches:
      - "master"
      - "main"
  pull_request:
    branches:
      - "master"
      - "main"

permissions:
  contents: read

jobs:
  lint:
    name: "Python syntax and lint"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v6.0.2"

      - name: "Set up Python"
        uses: "actions/setup-python@v6.2.0"
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "requirements_test.txt"

      - name: "Install lint dependencies"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_test.txt ruff

      - name: "Compile Python files"
        run: "python -m compileall custom_components/virtual_layer tests -q"

      - name: "Run Ruff"
        run: "ruff check custom_components/virtual_layer tests --select E9,F63,F7,F82"

      - name: "Check whitespace"
        run: "git diff --check"
