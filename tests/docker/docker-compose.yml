name: virtual-layer-homeassistant

services:
  homeassistant:
    container_name: virtual-layer-homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    volumes:
      - ./homeassistant/config:/config
      - ../../custom_components/virtual_layer:/config/custom_components/virtual_layer:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      TZ: Asia/Seoul
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "8123:8123"

  homeassistant-all-domains:
    profiles:
      - integration
    container_name: virtual-layer-all-domains
    image: ghcr.io/home-assistant/home-assistant:stable
    volumes:
      - ./all_domains/config:/config
      - ../../custom_components/virtual_layer:/config/custom_components/virtual_layer:ro
      - ./all_domains/virtual_layer_smoke:/config/custom_components/virtual_layer_smoke:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      TZ: Asia/Seoul
    restart: "no"
    network_mode: bridge
