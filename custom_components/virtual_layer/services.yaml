# Describes the format for available virtual services

turn_on:
  name: Turn On
  description: Turn on a binary sensor.
  target:
    entity:
      integration: virtual_layer
      domain: binary_sensor

turn_off:
  name: Turn Off
  description: Turn off a binary sensor.
  target:
    entity:
      integration: virtual_layer
      domain: binary_sensor

toggle:
  name: Toggle
  description: Toggle a binary sensor.
  target:
    entity:
      integration: virtual_layer
      domain: binary_sensor

set:
  name: Set
  description: Set the value of a sensor.
  target:
    entity:
      integration: virtual_layer
      domain: sensor
  fields:
    value:
      name: Value
      description: Value to set state to.
      required: true
      example: '10'
      selector:
        text:

set_available:
  name: Set Availability
  description: Set availability of an entity.
  target:
    entity:
      integration: virtual_layer
  fields:
    value:
      name: Value
      description: Is the entity available.
      example: false
      required: true
      selector:
        boolean:

set_state:
  name: Set State
  description: Set the state of a virtual entity.
  target:
    entity:
      integration: virtual_layer
  fields:
    value:
      name: Value
      description: Value to set state to.
      required: true
      example: 'on'
      selector:
        text:

set_attributes:
  name: Set Attributes
  description: Set extra state attributes on a virtual entity.
  target:
    entity:
      integration: virtual_layer
  fields:
    attributes:
      name: Attributes
      description: Attributes to add or update.
      required: true
      example: '{"battery_level": 91}'
      selector:
        object:

clear_attributes:
  name: Clear Attributes
  description: Clear extra state attributes from a virtual entity.
  target:
    entity:
      integration: virtual_layer
  fields:
    attributes:
      name: Attributes
      description: Attribute names to clear. Leave empty to clear all extra attributes.
      required: false
      example: 'battery_level'
      selector:
        text:

move:
  name: Move
  description: Move a device tracker to a new location.
  target:
    entity:
      integration: virtual_layer
      domain: device_tracker
  fields:
    location:
      name: Named Location
      description: Where to move the device tracker to.
      example: 'home'
      selector:
        text:
    gps:
      name: GPS Location
      description: Which coordinates to move the device tracker to.
      example: '{"latitude": -27.9699373, "longitude": 153.4081865}'
      selector:
        location:
          radius: false
    gps_accuracy:
      name: GPS Accuracy
      description: Accuracy radius for GPS coordinates.
      selector:
        number:
          min: 0
          mode: box
          unit_of_measurement: "m"
