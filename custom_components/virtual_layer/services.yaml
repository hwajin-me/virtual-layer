# Describes the format for available virtual services

turn_on:
  name: Turn On
  description: Turn on a binary sensor.
  target:
    entity:
      integration: virtual_layer
      domain: binary_sensor

turn_off:
  name: Turn Off
  description: Turn off a binary sensor.
  target:
    entity:
      integration: virtual_layer
      domain: binary_sensor

toggle:
  name: Toggle
  description: Toggle a binary sensor.
  target:
    entity:
      integration: virtual_layer
      domain: binary_sensor

set:
  name: Set
  description: Set the value of a sensor.
  target:
    entity:
      integration: virtual_layer
      domain: sensor
  fields:
    value:
      name: Value
      description: Value to set state to.
      required: true
      example: '10'
      selector:
        text:

adjust_utility_meter:
  name: Adjust Utility Meter
  description: Add consumption that the source meter missed to a virtual Utility Meter sensor. The amount is added to the current period; it does not change the physical source meter.
  target:
    entity:
      integration: virtual_layer
      domain: sensor
  fields:
    amount:
      name: Missing consumption
      description: A non-negative amount in the same unit as the utility meter, for example kWh.
      required: true
      example: 1.25
      selector:
        number:
          min: 0
          mode: box

calibrate_utility_meter:
  name: Calibrate Utility Meter
  description: Set the current-period total of a virtual Utility Meter sensor to an audited value.
  target:
    entity:
      integration: virtual_layer
      domain: sensor
  fields:
    value:
      name: Current-period value
      description: A finite non-negative value in the meter unit.
      required: true
      example: 42.5
      selector:
        number:
          min: 0
          mode: box

reset_utility_meter:
  name: Reset Utility Meter
  description: Close the current period and reset a virtual Utility Meter sensor to zero.
  target:
    entity:
      integration: virtual_layer
      domain: sensor

set_available:
  name: Set Availability
  description: Set availability of an entity.
  target:
    entity:
      integration: virtual_layer
  fields:
    value:
      name: Value
      description: Is the entity available.
      example: false
      required: true
      selector:
        boolean:

set_state:
  name: Set State
  description: Set the state of a virtual entity.
  target:
    entity:
      integration: virtual_layer
  fields:
    value:
      name: Value
      description: Value to set state to.
      required: true
      example: 'on'
      selector:
        text:

start_camera_patrol:
  name: Start camera patrol
  description: Start the configured ONVIF PTZ patrol for a virtual camera.
  target:
    entity:
      integration: virtual_layer
      domain: camera

stop_camera_patrol:
  name: Stop camera patrol
  description: Stop the configured ONVIF PTZ patrol and stop camera movement.
  target:
    entity:
      integration: virtual_layer
      domain: camera

set_attributes:
  name: Set Attributes
  description: Set extra state attributes on a virtual entity.
  target:
    entity:
      integration: virtual_layer
  fields:
    attributes:
      name: Attributes
      description: Attributes to add or update.
      required: true
      example: '{"battery_level": 91}'
      selector:
        object:

clear_attributes:
  name: Clear Attributes
  description: Clear extra state attributes from a virtual entity.
  target:
    entity:
      integration: virtual_layer
  fields:
    attributes:
      name: Attributes
      description: Attribute names to clear. Leave empty to clear all extra attributes.
      required: false
      example: 'battery_level'
      selector:
        text:

presence_fusion_set_primary:
  name: Select Presence Fusion primary GPS
  description: Select an available physical GPS candidate for a limited duration.
  fields:
    config_entry_id:
      name: Config entry
      description: This person's Virtual Layer config entry ID.
      required: true
      selector:
        config_entry:
          integration: virtual_layer
    tracked_device_id:
      name: Physical device UUID
      required: true
      description: UUID displayed in the physical-device selector.
      selector:
        text:
    duration:
      name: Duration
      description: 1–86400 seconds; omit to use the configured default.
      selector:
        number:
          min: 1
          max: 86400
          mode: box
          unit_of_measurement: s
presence_fusion_clear_primary_override:
  name: Clear Presence Fusion override
  description: Resume automatic tracking from observations of the currently selected device.
  fields:
    config_entry_id:
      name: Config entry
      description: This person's Virtual Layer config entry ID.
      required: true
      selector:
        config_entry:
          integration: virtual_layer
move:
  name: Move
  description: Move a device tracker to a new location.
  target:
    entity:
      integration: virtual_layer
      domain: device_tracker
  fields:
    location:
      name: Named Location
      description: Where to move the device tracker to.
      example: 'home'
      selector:
        text:
    gps:
      name: GPS Location
      description: Which coordinates to move the device tracker to.
      example: '{"latitude": -27.9699373, "longitude": 153.4081865}'
      selector:
        location:
          radius: false
    gps_accuracy:
      name: GPS Accuracy
      description: Accuracy radius for GPS coordinates.
      selector:
        number:
          min: 0
          mode: box
          unit_of_measurement: "m"
