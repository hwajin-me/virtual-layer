# Describes the format for available virtual services

turn_on:
  name: Turn On
  description: Turn on a binary sensor.
  target:
    entity:
      integration: virtual_layer
      domain: binary_sensor

turn_off:
  name: Turn Off
  description: Turn off a binary sensor.
  target:
    entity:
      integration: virtual_layer
      domain: binary_sensor

toggle:
  name: Toggle
  description: Toggle a binary sensor.
  target:
    entity:
      integration: virtual_layer
      domain: binary_sensor

set:
  name: Set
  description: Set the value of a sensor.
  target:
    entity:
      integration: virtual_layer
      domain: sensor
  fields:
    value:
      name: Value
      description: Value to set state to.
      required: true
      example: '10'
      selector:
        text:

set_available:
  name: Set Availability
  description: Set availability of an entity.
  target:
    entity:
      integration: virtual_layer
  fields:
    value:
      name: Value
      description: Is the entity available.
      example: false
      required: true
      selector:
        boolean:

set_state:
  name: Set State
  description: Set the state of a virtual entity.
  target:
    entity:
      integration: virtual_layer
  fields:
    value:
      name: Value
      description: Value to set state to.
      required: true
      example: 'on'
      selector:
        text:

set_attributes:
  name: Set Attributes
  description: Set extra state attributes on a virtual entity.
  target:
    entity:
      integration: virtual_layer
  fields:
    attributes:
      name: Attributes
      description: Attributes to add or update.
      required: true
      example: '{"battery_level": 91}'
      selector:
        object:

clear_attributes:
  name: Clear Attributes
  description: Clear extra state attributes from a virtual entity.
  target:
    entity:
      integration: virtual_layer
  fields:
    attributes:
      name: Attributes
      description: Attribute names to clear. Leave empty to clear all extra attributes.
      required: false
      example: 'battery_level'
      selector:
        text:

backup_devices:
  name: Backup Devices
  description: Back up one virtual device set or all virtual device sets.
  fields:
    file_name:
      name: File
      description: Backup JSON file path.
      required: true
      example: /config/virtual_layer_backup.json
      selector:
        text:
    group_name:
      name: Device
      description: Optional device name. Leave empty to back up all virtual device sets.
      required: false
      example: imported
      selector:
        text:

restore_devices:
  name: Restore Devices
  description: Restore virtual devices from a backup file.
  fields:
    file_name:
      name: File
      description: Backup JSON file path.
      required: true
      example: /config/virtual_layer_backup.json
      selector:
        text:
    group_name:
      name: Device
      description: Optional target device name. If the backup contains one device set, it can be restored into this device set.
      required: false
      example: imported
      selector:
        text:
    mode:
      name: Mode
      description: Merge with or replace existing UI-managed devices.
      required: false
      default: merge
      selector:
        select:
          options:
            - merge
            - replace
move:
  name: Move
  description: Move a device tracker to a new location.
  target:
    entity:
      integration: virtual_layer
      domain: device_tracker
  fields:
    location:
      name: Named Location
      description: Where to move the device tracker to.
      example: 'home'
      selector:
        text:
    gps:
      name: GPS Location
      description: Which coordinates to move the device tracker to.
      example: '{"latitude": -27.9699373, "longitude": 153.4081865}'
      selector:
        location:
          radius: false
    gps_accuracy:
      selector:
        number:
          min: 0
          mode: box
          unit_of_measurement: "m"
